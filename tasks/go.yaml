# https://taskfile.dev

version: '3'

vars:
  BUILD_DIR: bin
  TEST_REPORT: tests.xml
  COVERAGE_RAW: coverage.out
  COVERAGE_REPORT: coverage.html
  VERSION: "Task"

tasks:
  install:
    desc: Installs Golang dependencies and testing tools.
    cmds:
      - go get ./...

  install-ci:
    desc: Install packages and CI/CD tools.
    cmds:
      - task: install
      - go install github.com/jstemmer/go-junit-report/v2@latest
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/hairyhenderson/gomplate/v4/cmd/gomplate@latest

  build:
    desc: Builds binary.
    cmds:
      - mkdir {{.BUILD_DIR}} | true
      - go build -ldflags "-X main.version=${VERSION}" -o {{.BUILD_DIR}} ./...

  fmt:
    desc: Formats Golang code.
    cmds:
      - go fmt $(go list ./...)

  lint:
    desc: Lints Golang code.
    cmds:
      - golangci-lint run --timeout 5m

  # -p 1: every package's tests share the one local Argo CD, and pkg/cli selects projects by the
  # purpose=tests label that every package's test projects carry, so packages running in parallel
  # update each other's projects.
  test:
    desc: Run Golang tests.
    cmds:
      - go test -p 1 -v ./... 2>&1

  test-ci:
    desc: Run Golang tests and generate coverage report.
    # Without pipefail the pipeline exits with tee's status, so failing tests passed the CI step.
    set: [pipefail]
    cmds:
      - go test -p 1 --coverprofile {{.COVERAGE_RAW}} -v ./... 2>&1  | tee >(go-junit-report > report.xml)
      - go tool cover -html={{.COVERAGE_RAW}} -o {{.COVERAGE_REPORT}}
